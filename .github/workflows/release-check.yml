name: Release checks

on:
  push:
  pull_request:

jobs:
  server-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r thelife/requirements.txt
      - run: python -m unittest tests.test_release -v

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: thelife/app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: thelife/app
      - run: pnpm run build:web
        working-directory: thelife/app
      - run: pnpm exec cap sync android
        working-directory: thelife/app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x gradlew && ./gradlew assembleDebug lintDebug
        working-directory: thelife/app/android
