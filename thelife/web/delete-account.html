<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계정 및 데이터 삭제 · The Novelist</title>
<link rel="stylesheet" href="/static/delete-account.css">
</head>
<body>
<main>
  <p class="brand">THE NOVELIST</p>
  <h1>계정 및 데이터 삭제</h1>
  <p class="lead">앱을 다시 설치했거나 사용할 수 없을 때, 앱 설정에서 보관한 복구 코드로 계정과 창작 데이터를 영구 삭제할 수 있습니다.</p>
  <section>
    <label for="recovery">복구 코드</label>
    <textarea id="recovery" rows="3" autocomplete="off" spellcheck="false" placeholder="앱 설정에서 복사한 복구 코드를 붙여 넣으세요"></textarea>
    <label class="confirm"><input id="agree" type="checkbox"> 작품, 회차, 설정과 이용 기록이 복구할 수 없게 삭제됨을 확인했습니다.</label>
    <button id="delete" type="button">계정과 모든 데이터 삭제</button>
    <p id="status" role="status" aria-live="polite"></p>
  </section>
  <p class="note">복구 코드를 잃어버렸다면 앱의 설정에서 직접 삭제하거나 <a href="mailto:seoyeongsig6@gmail.com">운영자에게 문의</a>해 주세요. 스토어 구독은 별도로 Apple 또는 Google의 구독 관리에서 해지해야 합니다.</p>
  <p><a href="/privacy">개인정보처리방침</a></p>
</main>
<script src="/static/app-config.js"></script>
<script src="/static/delete-account.js" defer></script>
</body>
</html>
