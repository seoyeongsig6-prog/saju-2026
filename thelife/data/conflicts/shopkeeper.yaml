  seed: "재민이가 요즘 자꾸 지각을 한다"
  rise: "가정 형편이 어려워 알바를 하나 더 구한다는 눈치다"
  climax: "재민이가 사직 얘기를 꺼내려 머뭇거린다"
  resolve_good: "새벽 제빵 수업을 조건으로 재민이를 정식 제자로 들인다"
