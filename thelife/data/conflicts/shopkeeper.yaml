  seed: "낯선 계정이 악의적인 후기를 연달아 올린다"
  rise: "지도 앱 별점이 떨어지고 첫 방문 손님이 준다"
  climax: "후기 작성자가 누군지 짐작 가는 얼굴이 있다"
  resolve_good: "정면 대응 대신 손님들의 진짜 후기가 쌓여 소문을 덮는다"
  resolve_bad: "감정 대응 댓글이 캡처되어 더 큰 입방아에 오른다"
  luck_hook: "동네 커뮤니티의 유명 회원이 직접 다녀가 긴 반박 글을 쓴다"

- id: sk_jaemin
  scenario: shopkeeper
