# 갈등 은행 — 이순신 (실제 생애 갈등 + 시대 텍스처 생성 갈등)
- id: ys_twelve_ships
  scenario: yi_sunsin
  type: 권력
  scale: 대
  min_act: 1
  title: "남은 것은 열두 척"
  seed: "칠천량의 패전 소식과 함께, 남은 배가 겨우 열두 척이라는 장부가 올라온다"
  rise: "조정에서 수군을 파하고 육군에 합류하라는 유지가 내려온다"
  climax: "수군 폐지의 유지에 답해야 하는 밤 — 붓끝이 떨린다"
