id: fisherman
type: 현실
name: 강영식
era: "현대, 남해의 작은 항구"
place: "목포 인근 소포항"
goal: "내 배를 갖는다 — 중고 연안어선 '만선호'"
persona: "42세 어부. 무뚝뚝하지만 속정이 깊다. 물때를 몸으로 안다. 십 년째 남의 배를 탄다."
style: "짭짤한 바닷바람 같은 구어체. 뱃사람의 말투와 어시장 소리를 살린다."
money_unit: "원"
cast:
  - { name: "김 선장", role: "영식이 타는 배의 선장", affinity: 78, note: "잔소리꾼이지만 영식을 아들처럼 여긴다" }
  - { name: "만복", role: "동갑내기 갑판원", affinity: 70, note: "허풍이 세지만 위기에 몸을 던진다" }
  - { name: "혜자", role: "어시장 중매인", affinity: 62, note: "시세와 소문에 밝다, 계산은 칼 같다" }
  - { name: "박 조합장", role: "수협 조합장", affinity: 50, note: "대출 도장 하나에 목숨줄이 달렸다" }
milestones:
  - "계약금 절반을 모은다"
  - "수협 대출 승인을 받는다"
  - "'만선호' 매매 계약을 성사시킨다"
  - "내 배로 첫 출항을 한다"
schedule:
  - { t: "03:30", what: "기상, 컴컴한 새벽 부두로 나간다" }
  - { t: "04:30", what: "출항 — 그물과 미끼를 챙기고 물때를 본다" }
  - { t: "08:00", what: "그물 걷기, 갑판 위 아침 — 컵라면과 찬 바닷바람" }
  - { t: "12:00", what: "조업 계속, 만복이와 시답잖은 농담" }
  - { t: "15:30", what: "귀항 — 어시장 경매에 오늘 물을 올린다" }
  - { t: "18:00", what: "그물 손질, 내일 조업 준비" }
  - { t: "19:30", what: "선술집 국밥 한 그릇, 통장 잔고를 헤아려 본다" }
  - { t: "22:00", what: "잠자리에 든다" }
luck_dict:
  소:
    - "찢어진 줄 알았던 그물이 생각보다 멀쩡하다"
    - "혜자가 오늘 물을 시세보다 후하게 쳐준다"
    - "잊고 있던 곗돈 순번이 돌아온다"
  중:
    - "김 선장이 말없이 보증 도장을 찍어준다"
    - "일주일 내리 만선 — 갈치 떼가 항로에 들었다"
    - "옛 선주가 오래된 빚을 갚으러 찾아온다"
  대:
    - "'만선호' 선주가 값을 크게 낮춰 부른다 — 급히 뭍으로 가야 한단다"
    - "수협에 특별 어민 지원 융자가 열린다"
    - "태풍이 항로를 비껴가고, 남들이 못 나간 바다에서 홀로 만선한다"
