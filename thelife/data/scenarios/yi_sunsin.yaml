id: yi_sunsin
type: 역사
name: 이순신
era: "1597년, 조선"
place: "전라 우수영 · 울돌목 앞바다"
goal: "명량에서 조선 수군을 지켜낸다"
persona: "과묵하고 강직하다. 매일 일기를 쓴다. 부하를 아끼되 군율에 엄하고, 물길을 읽는 눈이 깊다."
style: "절제된 사극 톤. 짧은 문장. 바다와 물때의 감각을 살린다."
money_unit: "냥"
money_start: 300
cast:
  - { name: "송희립", role: "군관", affinity: 75, note: "직언을 아끼지 않는 참모" }
  - { name: "나대용", role: "선박 기술자", affinity: 68, note: "배 만드는 일에 미쳐 있다" }
  - { name: "안위", role: "거제 현령", affinity: 60, note: "겁이 많지만 물러서지 않는다" }
  - { name: "김돌쇠", role: "격군장", affinity: 65, note: "노 젓는 사내들의 우두머리, 입이 걸다" }
milestones:
  - "흩어진 수군과 민심을 수습한다"
  - "판옥선과 군량을 확보한다"
  - "울돌목의 물길을 읽어낸다"
  - "명량에서 왜 수군을 막아낸다"
schedule:
  - { t: "04:30", what: "기상, 갑판을 돌며 바다 냄새로 날씨를 가늠한다" }
  - { t: "06:00", what: "활터에서 활 다섯 순, 군관들과 조련" }
  - { t: "08:00", what: "조반 후 장계와 군무 — 남은 배와 군량을 헤아린다" }
  - { t: "11:00", what: "포구를 돌며 피난민과 어부들의 말을 듣는다" }
  - { t: "14:00", what: "물때 관측 — 울돌목의 조류가 바뀌는 시각을 기록한다" }
  - { t: "17:00", what: "군관 회의, 척후의 보고를 받는다" }
  - { t: "20:00", what: "홀로 등잔 아래에서 일기를 쓴다" }
  - { t: "22:00", what: "잠자리에 든다" }
luck_dict:
  소:
    - "척후선이 왜선의 움직임을 하루 일찍 알아온다"
    - "피난민 어부가 울돌목 물길의 비밀 하나를 일러준다"
    - "군량 스무 섬이 뜻밖에 포구에 닿는다"
  중:
    - "조정에서 판옥선 두 척 증원이 결정된다"
    - "흩어졌던 수군 백여 명이 소문을 듣고 돌아온다"
    - "명나라 상인이 화약과 철환을 헐값에 넘긴다"
  대:
    - "나대용의 새 배 건조가 예상보다 훨씬 빨리 끝난다"
    - "결전의 날, 울돌목의 물때가 아군에 유리하게 바뀐다"
    - "왜 수군 진영에 내분이 일어 출정이 늦어진다"
