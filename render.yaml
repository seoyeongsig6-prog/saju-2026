services:
  - type: web
    name: thelife
    runtime: python
    rootDir: thelife
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.novelist_main:app --host 0.0.0.0 --port $PORT
    envVars:
      # 판매용 소설 앱 전용 모드. 전체 AI 본문 생성은 막고 기획·가이드 기능만 제공합니다.
      - key: WRITER_LAUNCH_MODE
        value: "1"

      # Render 대시보드에서 실제 값을 보관합니다. 저장소에는 비밀값을 넣지 않습니다.
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false

      # AI 공급자와 모델. 대시보드 값이 있으면 그 값이 우선 적용됩니다.
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.6-flash

      # 결제를 연결할 때 사용하는 선택 항목입니다. 없으면 결제 요청은 안전하게 거절됩니다.
      - key: REVENUECAT_SECRET
        sync: false
      - key: REVENUECAT_WEBHOOK_AUTH
        sync: false
